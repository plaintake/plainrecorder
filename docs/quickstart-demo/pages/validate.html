<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PlainTake quickstart — Validate</title>
  <link rel="stylesheet" href="quickstart.css">
</head>
<body>
  <header class="top">
    <span class="wordmark">Plain<span class="take">Take</span></span>
    <span class="crumb">quickstart · 03 — Validate</span>
    <span class="site">plaintake.github.io</span>
  </header>

  <main class="stage">
    <section class="card">
      <div class="titlebar">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span class="title">zsh — validate</span>
      </div>
      <div class="term">
        <button class="cmd" id="validate-cmd">
          <span class="ps">$</span>
          <span>plaintake validate examples/release-approval.demo.ts</span>
        </button>
        <div class="out" id="validate-out" hidden>
          <span><span class="ok">validate ok:</span> release-approval — Approve the 0.2.0 release</span>
          <span>5 steps · 1 assert · en</span>
        </div>
        <p class="note"># no browser opens — the scenario is checked before anything is filmed</p>
      </div>
    </section>
  </main>

  <script>
    document.querySelectorAll('button.cmd[id$="-cmd"]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const out = document.getElementById(`${btn.id.replace('-cmd', '')}-out`);
        if (!out || !out.hidden) return;
        out.hidden = false;
        out.classList.add('in');
      });
    });
  </script>
</body>
</html>
