<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PlainTake quickstart — Install</title>
  <link rel="stylesheet" href="quickstart.css">
</head>
<body>
  <header class="top">
    <span class="wordmark">Plain<span class="take">Take</span></span>
    <span class="crumb">quickstart · 01 — Install</span>
    <span class="site">plaintake.github.io</span>
  </header>

  <main class="stage">
    <section class="card">
      <div class="titlebar">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span class="title">zsh — install</span>
      </div>
      <div class="term">
        <button class="cmd" id="download-cmd">
          <span class="ps">$</span>
          <span>curl -LO …/releases/download/v$VERSION/plaintake-$VERSION-darwin-arm64.tar.gz</span>
        </button>
        <p class="note"># SHA256SUMS and install.sh come from the same release page</p>

        <div class="cmd static">
          <span class="ps">$</span>
          <span>shasum -a 256 -c SHA256SUMS --ignore-missing</span>
        </div>

        <div class="cmd static">
          <span class="ps">$</span>
          <span>sh install.sh plaintake-$VERSION-darwin-arm64.tar.gz</span>
        </div>

        <button class="cmd" id="doctor-cmd">
          <span class="ps">$</span>
          <span>plaintake doctor</span>
        </button>
        <div class="out" id="doctor-out" hidden>
          <span><span class="ok">✓</span> ffmpeg 9.0.1 · libass 0.17.5</span>
          <span><span class="ok">✓</span> chromium · speech ready</span>
        </div>
      </div>
    </section>
  </main>

  <script>
    document.querySelectorAll('button.cmd[id$="-cmd"]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const out = document.getElementById(`${btn.id.replace('-cmd', '')}-out`);
        if (!out || !out.hidden) return;
        out.hidden = false;
        out.classList.add('in');
      });
    });
  </script>
</body>
</html>
